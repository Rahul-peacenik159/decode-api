name: Decode Pipeline

# Triggered by Make.com via GitHub API
# POST /repos/Rahul-peacenik159/decode-api/dispatches
# Body: {
#   "event_type": "decode",
#   "client_payload": {
#     "url": "https://www.descope.com",
#     "slug": "descope",
#     "make_webhook_url": "https://hook.eu1.make.com/xxxxx"
#   }
# }

on:
  repository_dispatch:
    types: [decode]

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone pipeline repos
        run: |
          git clone --depth 1 https://github.com/Rahul-peacenik159/website-decoder.git website-decoder
          git clone --depth 1 https://github.com/Rahul-peacenik159/pptx-builder.git     pptx-builder
          git clone --depth 1 https://github.com/Rahul-peacenik159/social-decoder.git   social-decoder

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r website-decoder/requirements.txt
          pip install --quiet -r pptx-builder/requirements.txt
          pip install --quiet -r social-decoder/requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
        run: |
          mkdir -p /tmp/output
          python pipeline.py \
            --url    "${{ github.event.client_payload.url }}" \
            --slug   "${{ github.event.client_payload.slug }}" \
            --output /tmp/output \
            --repo1  ./website-decoder \
            --repo2  ./pptx-builder \
            --repo3  ./social-decoder

      - name: Find output PPTX
        id: pptx
        run: |
          FILE=$(ls /tmp/output/*.pptx | tail -1)
          echo "path=$FILE"             >> $GITHUB_OUTPUT
          echo "name=$(basename $FILE)" >> $GITHUB_OUTPUT

      - name: Upload PPTX to file.io (temp link)
        id: upload
        run: |
          RESPONSE=$(curl -s -F "file=@${{ steps.pptx.outputs.path }}" \
                          -F "expires=1d" \
                          https://file.io)
          echo "Response: $RESPONSE"
          LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('link',''))")
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: Send result to Make.com webhook
        run: |
          curl -s -X POST "${{ github.event.client_payload.make_webhook_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "status":        "done",
              "pptx_url":      "${{ steps.upload.outputs.link }}",
              "pptx_filename": "${{ steps.pptx.outputs.name }}",
              "url":           "${{ github.event.client_payload.url }}",
              "slug":          "${{ github.event.client_payload.slug }}",
              "run_url":       "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

      - name: Notify Make.com on failure
        if: failure()
        run: |
          curl -s -X POST "${{ github.event.client_payload.make_webhook_url }}" \
            -H "Content-Type: application/json" \
            -d '{
              "status":  "failed",
              "url":     "${{ github.event.client_payload.url }}",
              "slug":    "${{ github.event.client_payload.slug }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
